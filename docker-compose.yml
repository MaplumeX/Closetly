services:
  closetly:
    # 版本在 .env 中用 CLOSETLY_VERSION 固定；从源码构建见 docker-compose.build.yml
    image: ghcr.io/maplumex/closetly:${CLOSETLY_VERSION:-latest}
    container_name: closetly
    restart: unless-stopped
    env_file: .env
    environment:
      # 应用端口只对反向代理开放时可以用 *；否则改成代理的 IP
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    ports:
      # 默认只监听本机，由同机的反向代理转发。
      # 如果反向代理也在 Docker 里，可以删掉 ports，改为加入代理所在的网络。
      - "${CLOSETLY_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - ./data:/data
